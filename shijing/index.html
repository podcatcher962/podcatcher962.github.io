    '进去的人，都带着一粒种子出来。你要是想好了，就去推。'
  ]
};
function alFolkAt(mx, my) {
  var best = null, bd = 1e9;
  for (var i = 0; i < FOLK.length; i++) {
    var f = FOLK[i];
    if (!f._v) continue;
    var hw = Math.max(16, f._w * 0.95);
    if (mx < f._sx - hw || mx > f._sx + hw) continue;
    if (my < f._sy - f._h * 1.30 || my > f._sy + 10) continue;
    var d = Math.abs(mx - f._sx) + Math.abs(my - (f._sy - f._h * 0.4));
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}
function alTalk(f) {
  var n = AL.said[f.id] || 0;
  var pool = ALINES[f.id] || [];
  AL.say = { f: f, text: pool[Math.min(n, pool.length - 1)], at: performance.now() };
  AL.said[f.id] = Math.min(n + 1, pool.length);
}

/* ============================================================
   墙：一户一户地砌
   ============================================================ */
var SEG = 1.45;
var BRIDGE_Z = 8.35;      /* 过街楼 */

function segIn(i, side) {
  var s = side > 0 ? 300 : 700;
  return 0.02 + 0.32 * h2(i, s + 1);
}
function segEH(i, side) {
  var s = side > 0 ? 300 : 700;
  var lvl = Math.floor(h2(i, s + 2) * 3);      /* 0/1/2 三档 */
  return AHH + (lvl - 1) * 0.30;
}
/* 墙一直砌到檐根，不能留缝 */
function segTop(i, side) { return segEH(i, side) + 0.32; }

/* 一堵墙，从 z0 到 z1 */
function alWall(side, i, z0, z1, pp) {
  var ins = segIn(i, side);
  var x = side * (AW - ins);
  var hz = cl(z0 / 40, 0.02, 0.44);
  var r1 = h2(i, side > 0 ? 11 : 21);
  var r2 = h2(i, side > 0 ? 12 : 22);
  var r3 = h2(i, side > 0 ? 13 : 23);

  var EH = segTop(i, side);
  var plaster = r1 < 0.30 ? '#cfc0a2' : (r1 < 0.58 ? '#c6b696' : (r1 < 0.80 ? '#d2c4a6' : '#bcac8e'));

  /* 墙面：上亮下暗 */
  var a = alProj(x, 0, z0), b = alProj(x, 0, z1), c = alProj(x, EH, z1), d = alProj(x, EH, z0);
  if (!alQuad(a, b, c, d)) return;
  var gr = g.createLinearGradient(0, c[1], 0, a[1]);
  gr.addColorStop(0, shd(plaster, z0, kSide(kUp(EH * 0.98, z0), side)));
  gr.addColorStop(0.34, shd(plaster, z0, kSide(kUp(EH * 0.72, z0), side)));
  gr.addColorStop(0.72, shd(plaster, z0, kSide(kUp(1.5, z0), side)));
  gr.addColorStop(1, shd(plaster, z0, kSide(kUp(0.05, z0), side)));
  g.fillStyle = gr;
  g.fill();

  /* 墙面本身的老：抹灰斑驳、雨痕、墙根潮 */
  alSkin(side, i, z0, z1, x, r1);

  /* 墙根砖裙 */
  alFace(x, 0, 0.58, z0, z1, shd('#8d8474', z0, kSide(kUp(0.45, z0), side)));
  g.save();
  var b1 = alProj(x, 0, z0), b2 = alProj(x, 0, z1), b3 = alProj(x, 0.58, z1), b4 = alProj(x, 0.58, z0);
  if (alQuad(b1, b2, b3, b4)) {
    g.clip();
    g.strokeStyle = 'rgba(44,36,26,0.18)';
    g.lineWidth = 0.9;
    for (var r = 1; r < 4; r++) {
      var yy = 0.58 * r / 3;
      var p1 = alProj(x, yy, z0), p2 = alProj(x, yy, z1);
      if (p1 && p2) { g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.stroke(); }
    }
    g.restore();
  } else { g.restore(); }

  /* 水渍 / 霉 */
  if (r3 > 0.5) {
    g.save();
    var s1 = alProj(x, segEH(i, side) * 0.92, z0 + (z1 - z0) * 0.16);
    var s2 = alProj(x, segEH(i, side) * 0.92, z1 - (z1 - z0) * 0.16);
    var s3 = alProj(x, 0.5, z1 - (z1 - z0) * 0.16);
    var s4 = alProj(x, 0.5, z0 + (z1 - z0) * 0.16);
    if (alQuad(s1, s2, s3, s4)) {
      g.fillStyle = 'rgba(74,66,48,' + (0.04 + 0.06 * r3) + ')';
      g.fill();
    }
    g.restore();
  }

  /* 门 / 窗 / 挂件 / 光墙 */
  if (r2 < 0.21) {
    alDoor(side, i, z0, z1, x, pp, r1);
  } else if (r2 < 0.35) {
    alWin(side, i, z0, z1, x, pp, r1);
  } else if (r2 < 0.45) {
    alHang(side, i, z0, z1, x, pp, r1);
  } else {
    alCracks(side, i, z0, z1, x, pp, r1);
  }

  /* 有的门口靠墙搭个偏厦 */
  if (r3 > 0.74 && r3 < 0.88 && z1 - z0 > 0.7) alShed(side, i, z0, z1, x, pp);

  /* 墙根一层尘土，把墙和地咬住 */
  var t1 = alProj(x, 0, z0), t2 = alProj(x, 0, z1), t3 = alProj(x, 0.30, z1), t4 = alProj(x, 0.30, z0);
  if (alQuad(t1, t2, t3, t4)) {
    g.fillStyle = 'rgba(36,26,16,0.20)';
    g.fill();
  }
}

/* ---------- 墙面材质 ----------
   一段墙一米四长、四米高，在这条巷子里占屏幕一大块。
   只给一层明暗渐变，它就是一堵新砌的水泥板。
   这一层加的是"旧"：抹灰掉得不匀、雨水从檐口淌下来留下竖痕、
   墙根常年潮着，往上慢慢淡掉。全部按户号固定，不逐帧随机。 */
function alSkin(side, i, z0, z1, x, r1) {
  var EH = segTop(i, side);
  var a = alProj(x, 0, z0), b = alProj(x, 0, z1),
      c = alProj(x, EH, z1), d = alProj(x, EH, z0);
  if (!alQuad(a, b, c, d)) return;
  g.save();
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  g.clip();
  g.beginPath();

  var w = z1 - z0;

  /* 抹灰斑驳，分三档：
     大块管整面墙的不匀（一两米），中块是补过的灰，
     小块是起皮。只有大块在八米外还看得见，所以先把它立住。 */
  var mLayer = [
    { n: 3,  r0: 0.95, r1: 2.60, a0: 0.045, a1: 0.085, seed: 131 },
    { n: 8,  r0: 0.34, r1: 1.05, a0: 0.070, a1: 0.150, seed: 231 },
    { n: 14, r0: 0.06, r1: 0.30, a0: 0.090, a1: 0.200, seed: 331 }
  ];
  for (var ly = 0; ly < mLayer.length; ly++) {
    var L = mLayer[ly];
    for (var mi = 0; mi < L.n; mi++) {
      var sk = i * 101 + ly * 37 + mi;
      var sz = z0 + w * (0.06 + 0.88 * h2(sk, L.seed));
      if (sz - AL.z < 0.35) continue;
      /* 最小的那层只在近处画，远了看不见还费笔 */
      if (ly === 2 && sz - AL.z > 7.5) continue;
      var sy = 0.25 + (EH - 0.45) * h2(sk, L.seed + 1);
      var sp = alProj(x, sy, sz);
      if (!sp) continue;
      var sc = FOC / (sz - AL.z);
      var rx = (L.r0 + (L.r1 - L.r0) * h2(sk, L.seed + 2)) * sc;
      var ry = rx * (0.55 + 1.35 * h2(sk, L.seed + 3));
      var dk = h2(sk, L.seed + 4);
      var amax = L.a0 + (L.a1 - L.a0) * h2(sk, L.seed + 5);
      var mg = g.createRadialGradient(sp[0], sp[1], 0, sp[0], sp[1], rx);
      if (dk < 0.56) {
        mg.addColorStop(0, 'rgba(44,31,17,' + amax + ')');
        mg.addColorStop(0.52, 'rgba(44,31,17,' + (amax * 0.42) + ')');
        mg.addColorStop(1, 'rgba(44,31,17,0)');
      } else {
        mg.addColorStop(0, 'rgba(255,248,228,' + (amax * 0.85) + ')');
        mg.addColorStop(1, 'rgba(255,248,228,0)');
      }
      g.fillStyle = mg;
      g.beginPath(); g.ellipse(sp[0], sp[1], rx, ry, 0, 0, TAU); g.fill();
    }
  }

  /* 雨痕：从檐根往下淌的那几道，越往下越淡 */
  var nr = 4 + Math.floor(h2(i, 141) * 6);
  for (var ri = 0; ri < nr; ri++) {
    var rz = z0 + w * (0.06 + 0.88 * h2(i * 13 + ri, 142));
    if (rz - AL.z < 0.32) continue;
    var yb = EH * (0.20 + 0.62 * h2(i * 13 + ri, 143));
    var q1 = alProj(x, EH - 0.14, rz), q2 = alProj(x, yb, rz);
    if (!q1 || !q2) continue;
    var wid = Math.max(0.7, (0.016 + 0.042 * h2(i * 13 + ri, 144)) * FOC / (rz - AL.z));
    var lg = g.createLinearGradient(0, q1[1], 0, q2[1]);
    lg.addColorStop(0, 'rgba(40,29,16,0)');
    lg.addColorStop(0.28, 'rgba(40,29,16,' + (0.055 + 0.065 * h2(i * 13 + ri, 145)) + ')');
    lg.addColorStop(0.72, 'rgba(40,29,16,' + (0.030 + 0.045 * h2(i * 13 + ri, 146)) + ')');
    lg.addColorStop(1, 'rgba(40,29,16,0)');
    g.strokeStyle = lg;
    g.lineWidth = wid;
    g.beginPath(); g.moveTo(q1[0], q1[1]); g.lineTo(q2[0], q2[1]); g.stroke();
  }

  /* 墙根潮：下深上淡，上沿起伏不平 */
  var ny = 0.48 + 0.40 * h2(i, 151);
  var pA = alProj(x, 0, z0), pB = alProj(x, 0, z1);
  var pT = alProj(x, ny, (z0 + z1) * 0.5);
  if (pA && pB && pT) {
    var cg = g.createLinearGradient(0, pA[1], 0, pT[1]);
    cg.addColorStop(0, 'rgba(42,32,20,' + (0.14 + 0.09 * h2(i, 152)) + ')');
    cg.addColorStop(1, 'rgba(42,32,20,0)');
    g.fillStyle = cg;
    g.beginPath();
    g.moveTo(pA[0], pA[1]);
    var steps = 8;
    for (var si = 0; si <= steps; si++) {
      var zz = lp(z0, z1, si / steps);
      var hh = ny * (0.55 + 0.45 * h2(i * 17 + si, 153));
      var pt = alProj(x, hh, zz);
      if (pt) g.lineTo(pt[0], pt[1]);
    }
    g.lineTo(pB[0], pB[1]);
    g.closePath();
    g.fill();
  }

  g.restore();
}

/* 门：石门框 + 门槛 + 门墩 + 残红 */
function alDoor(side, i, z0, z1, x, pp, r1) {
  var w = z1 - z0;
  var za = z0 + w * 0.26, zb = z1 - w * 0.26;
  var top = 2.02;
  var hz = cl(z0 / 40, 0.02, 0.44);

  /* 门洞（黑） */
  alFace(x, 0.03, top, za, zb, shd('#241a10', z0, 0.55));

  /* 两扇门 */
  var mid = (za + zb) * 0.5;
  var lf = r1 < 0.5;
  alFace(x, 0.03, top - 0.04, za, mid, shd(lf ? '#6d5436' : '#5e472c', z0, kUp(1.3, z0)));
  alFace(x, 0.03, top - 0.04, mid, zb, shd(lf ? '#634b30' : '#66502f', z0, kUp(1.3, z0)));

  /* 板缝 */
  g.strokeStyle = 'rgba(26,18,10,0.34)';
  g.lineWidth = 0.9;
  for (var k = 1; k < 3; k++) {
    var zz = lp(za, mid, k / 3);
    var q1 = alProj(x, 0.1, zz), q2 = alProj(x, top - 0.1, zz);
    if (q1 && q2) { g.beginPath(); g.moveTo(q1[0], q1[1]); g.lineTo(q2[0], q2[1]); g.stroke(); }
    var zz2 = lp(mid, zb, k / 3);
    var p1 = alProj(x, 0.1, zz2), p2 = alProj(x, top - 0.1, zz2);
    if (p1 && p2) { g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.stroke(); }
  }
  /* 门缝一线亮 */
  var a1 = alProj(x, 0.05, mid), a2 = alProj(x, top - 0.06, mid);
  if (a1 && a2) {
    g.strokeStyle = 'rgba(255,206,140,' + (0.10 + pp.lamp * 0.45) + ')';
    g.lineWidth = Math.max(0.6, 60 / (z0 + 1) * 0.03);
    g.beginPath(); g.moveTo(a1[0], a1[1]); g.lineTo(a2[0], a2[1]); g.stroke();
  }
  /* 门环 */
  var hr = alProj(x, 1.06, lp(za, mid, 0.86));
  if (hr) {
    g.strokeStyle = 'rgba(176,142,84,0.55)';
    g.lineWidth = Math.max(0.8, 1.2);
    g.beginPath(); g.arc(hr[0], hr[1], Math.max(1.2, 90 / (z0 + 1) * 0.10), 0, TAU); g.stroke();
  }

  /* 石门框 */
  alFace(x, 0, top + 0.26, za - 0.055, za, shd('#b0a184', z0, kUp(1.6, z0)));
  alFace(x, 0, top + 0.26, zb, zb + 0.055, shd('#b0a184', z0, kUp(1.6, z0)));
  alFace(x, top, top + 0.26, za - 0.055, zb + 0.055, shd('#c0b195', z0, kUp(2.4, z0)));

  /* 门槛 */
  alFace(x, 0, 0.14, za - 0.06, zb + 0.06, shd('#8d8069', z0, kUp(0.5, z0)));
  /* 门墩 */
  var dz1 = alProj(x, 0, za - 0.16), dz2 = alProj(x, 0.42, za - 0.16);
  if (dz1 && dz2) {
    var dw = Math.max(2, 220 / (z0 + 1) * 0.12);
    g.fillStyle = shd('#9a8d74', z0, kUp(0.6, z0));
    g.beginPath();
    g.ellipse((dz1[0] + dz2[0]) / 2, dz1[1], dw, dw * 0.9, 0, 0, TAU);
    g.fill();
  }

  /* 门边褪色的红纸（对联） */
  if (h2(i, 31) < 0.55 && z0 < 13) {
    alFace(x, 0.94, 1.98, za - 0.15, za - 0.055, shd('#8f4433', z0, kUp(1.4, z0)));
    alFace(x, 0.94, 1.98, zb + 0.055, zb + 0.15, shd('#87402f', z0, kUp(1.4, z0) * 0.96));
  }
  /* 门上一块旧匾 */
  if (h2(i, 41) < 0.34 && z0 < 11) {
    alFace(x, top + 0.32, top + 0.66, za - 0.02, zb + 0.02, shd('#6a5638', z0, kUp(2.6, z0)));
  }
}

/* 窗：木格 + 里面一点亮 */
function alWin(side, i, z0, z1, x, pp, r1) {
  var w = z1 - z0;
  var za = z0 + w * 0.30, zb = z1 - w * 0.30;
  var y0 = 2.10, y1 = 3.06;
  var glowIn = pp.lamp > 0.2 || r1 < 0.55;
  alFace(x, y0, y1, za, zb, glowIn
    ? 'rgba(255,208,142,' + (0.24 + pp.lamp * 0.55) + ')'
    : shd('#332a1e', z0, 0.6));

  /* 窗棂 */
  g.strokeStyle = shd('#4a3826', z0, kUp(2.5, z0));
  g.lineWidth = Math.max(0.8, 1.5);
  for (var m = 1; m < 4; m++) {
    var v1 = alProj(x, y0, lp(za, zb, m / 4)), v2 = alProj(x, y1, lp(za, zb, m / 4));
    if (v1 && v2) { g.beginPath(); g.moveTo(v1[0], v1[1]); g.lineTo(v2[0], v2[1]); g.stroke(); }
    var h1 = alProj(x, lp(y0, y1, m / 4), za), h2b = alProj(x, lp(y0, y1, m / 4), zb);
    if (h1 && h2b) { g.beginPath(); g.moveTo(h1[0], h1[1]); g.lineTo(h2b[0], h2b[1]); g.stroke(); }
  }
  /* 窗框 */
  alFace(x, y0 - 0.07, y0, za - 0.04, zb + 0.04, shd('#9e8f74', z0, kUp(2.1, z0)));
  alFace(x, y1, y1 + 0.07, za - 0.04, zb + 0.04, shd('#9e8f74', z0, kUp(3.0, z0)));
  alFace(x, y0, y1, za - 0.04, za, shd('#9e8f74', z0, kUp(2.5, z0)));
  alFace(x, y0, y1, zb, zb + 0.04, shd('#9e8f74', z0, kUp(2.5, z0)));

  /* 夜里窗下的光 */
  if (pp.lamp > 0.15) {
    var cp = alProj(x, y0, (za + zb) / 2);
    if (cp) {
      var rr = Math.max(8, 300 / (z0 + 1) * 0.7);
      var gr = g.createRadialGradient(cp[0], cp[1], 0, cp[0], cp[1], rr);
      gr.addColorStop(0, 'rgba(255,206,140,' + (0.16 * pp.lamp) + ')');
      gr.addColorStop(1, 'rgba(255,196,120,0)');
      g.fillStyle = gr;
      g.beginPath(); g.arc(cp[0], cp[1], rr, 0, TAU); g.fill();
    }
  }
}

/* 墙上挂点东西：簸箕、蒜辫、竹竿 */
function alHang(side, i, z0, z1, x, pp, r1) {
  var w = z1 - z0;
  var zc = (z0 + z1) * 0.5;
  var cp = alProj(x, 2.34, zc);
  if (!cp) return;
  var sc = FOC / (zc - AL.z);
  var hz = cl(z0 / 40, 0.02, 0.44);
  if (r1 < 0.5) {
    /* 簸箕 */
    g.fillStyle = shd('#a89464', z0, kUp(2.4, z0));
    g.beginPath();
    g.ellipse(cp[0], cp[1], 0.26 * sc, 0.20 * sc, 0, 0, TAU);
    g.fill();
    g.strokeStyle = shd('#7a6947', z0, kUp(2.4, z0));
    g.lineWidth = Math.max(0.7, 0.012 * sc);
    g.beginPath();
    g.ellipse(cp[0], cp[1], 0.26 * sc, 0.20 * sc, 0, Math.PI * 0.15, Math.PI * 0.85);
    g.stroke();
  } else {
    /* 一挂蒜 */
    g.strokeStyle = shd('#8a7a5a', z0, kUp(2.4, z0));
    g.lineWidth = Math.max(0.6, 0.008 * sc);
    g.beginPath(); g.moveTo(cp[0], cp[1] - 0.20 * sc); g.lineTo(cp[0], cp[1] + 0.14 * sc); g.stroke();
    g.fillStyle = shd('#cfc4a4', z0, kUp(2.3, z0));
    for (var k = 0; k < 5; k++) {
      var yy = cp[1] - 0.14 * sc + k * 0.072 * sc;
      g.beginPath();
      g.ellipse(cp[0] + (k % 2 ? 0.028 : -0.028) * sc, yy, 0.032 * sc, 0.040 * sc, 0, 0, TAU);
      g.fill();
    }
  }
}

/* 光墙：几道裂缝、一块剥落的灰、墙根一块拴马石 */
function alCracks(side, i, z0, z1, x, pp, r1) {
  var w = z1 - z0;
  /* 裂缝 */
  var nc = 1 + Math.floor(h2(i, 81) * 3);
  g.strokeStyle = 'rgba(64,52,36,' + (0.10 + 0.08 * h2(i, 82)) + ')';
  g.lineWidth = 0.9;
  for (var k = 0; k < nc; k++) {
    var zz = z0 + w * (0.15 + 0.7 * h2(i * 7 + k, 83));
    var yTop = 2.4 + 1.5 * h2(i * 7 + k, 84);
    var yBot = 0.35 + 0.9 * h2(i * 7 + k, 85);
    var p1 = alProj(x, yTop, zz);
    var p2 = alProj(x, (yTop + yBot) / 2, zz + w * 0.10 * (h2(i * 7 + k, 86) - 0.5));
    var p3 = alProj(x, yBot, zz + w * 0.16 * (h2(i * 7 + k, 87) - 0.5));
    if (p1 && p2 && p3) {
      g.beginPath();
      g.moveTo(p1[0], p1[1]);
      g.lineTo(p2[0], p2[1]);
      g.lineTo(p3[0], p3[1]);
      g.stroke();
    }
  }
  /* 墙根的拴马石 */
  if (r1 < 0.45 && z0 < 12) {
    var b1 = alProj(x + side * 0.18, 0, z0 + w * 0.5);
    if (b1) {
      var sc = FOC / (z0 + w * 0.5 - AL.z);
      g.fillStyle = shd('#8a7f68', z0, kUp(0.4, z0));
      g.fillRect(b1[0] - 0.09 * sc, b1[1] - 0.34 * sc, 0.18 * sc, 0.34 * sc);
      g.fillStyle = shd('#a09579', z0, kUp(0.6, z0));
      g.fillRect(b1[0] - 0.11 * sc, b1[1] - 0.40 * sc, 0.22 * sc, 0.07 * sc);
    }
  }
}

/* 两户之间的台阶：墙缩进去 / 墙高出一截，都要有一块侧面兜住 */
function alReturn(side, i, z, pp) {
  if (z < AL.z + 0.45) return;
  var xa = side * (AW - segIn(i, side));
  var xb = side * (AW - segIn(i - 1, side));
  var ta = segTop(i, side), tb = segTop(i - 1, side);
  if (Math.abs(xa - xb) < 0.004 && Math.abs(ta - tb) < 0.02) return;
  var yTop = Math.max(ta, tb);
  var p1 = alProj(xa, 0, z), p2 = alProj(xb, 0, z);
  var p3 = alProj(xb, yTop, z), p4 = alProj(xa, yTop, z);
  if (!alQuad(p1, p2, p3, p4)) return;
  g.fillStyle = shd('#9a8a6b', z, kUp(1.3, z) * 0.80);
  g.fill();
  g.strokeStyle = 'rgba(30,22,14,0.20)';
  g.lineWidth = 1;
  g.stroke();
}

/* 檐：往外探、往外垂，檐底压着椽子 */
function alEaves(pp) {
  var n = Math.ceil(ALEN / SEG);
  for (var i = n - 1; i >= 0; i--) {
    var z0 = i * SEG, z1 = Math.min(ALEN, z0 + SEG);
    if (z1 < AL.z + 0.40) continue;
    var za = Math.max(z0, AL.z + 0.40), zb = z1;
    for (var s = -1; s <= 1; s += 2) {
      var ins = segIn(i, s), eh = segEH(i, s);
      var xw = s * (AW - ins);            /* 贴墙，高 */
      var xe = s * (AW - ins - 0.26);     /* 探出来，低 */
      var yW = eh + 0.32, yE = eh;   /* segTop = eh+0.32 */

      /* 檐底（背着光的斜面） */
      var a = alProj(xw, yW, za), b = alProj(xw, yW, zb);
      var c = alProj(xe, yE, zb), d = alProj(xe, yE, za);
      if (alQuad(a, b, c, d)) {
        g.fillStyle = shd('#2e2921', z0, 0.88);
        g.fill();
      }

      /* 椽子：从檐口往墙里排 */
      if (zb - za > 0.08) {
        var rn = Math.max(1, Math.round((zb - za) / 0.34));
        g.strokeStyle = shd('#4a4132', z0, 0.96);
        g.lineWidth = Math.max(0.7, 26 / (z0 - AL.z + 1.4) * 0.10);
        for (var k = 0; k <= rn; k++) {
          var zz = lp(za, zb, k / rn);
          var q1 = alProj(xe, yE, zz), q2 = alProj(xw, yW - 0.04, zz);
          if (q1 && q2) { g.beginPath(); g.moveTo(q1[0], q1[1]); g.lineTo(q2[0], q2[1]); g.stroke(); }
        }
      }

      /* 檐口：一道厚边 + 瓦当 */
      var e1 = alProj(xe, yE - 0.10, za), e2 = alProj(xe, yE - 0.10, zb);
      var e3 = alProj(xe, yE + 0.04, zb), e4 = alProj(xe, yE + 0.04, za);
      if (alQuad(e1, e2, e3, e4)) {
        g.fillStyle = shd('#5c5344', z0, 1.04);
        g.fill();
      }
      /* 瓦当：檐口一排小圆 */
      if (z0 < 12 && zb - za > 0.05) {
        var cnt = Math.max(2, Math.round((zb - za) / 0.26));
        for (var k2 = 0; k2 < cnt; k2++) {
          var zz2 = lp(za, zb, (k2 + 0.5) / cnt);
          var w = alProj(xe, yE - 0.02, zz2);
          if (w) {
            var rr = Math.max(0.9, 70 / (zz2 - AL.z + 1) * 0.075);
            g.fillStyle = shd('#413a2e', z0, 1.02);
            g.beginPath(); g.arc(w[0], w[1], rr, 0, TAU); g.fill();
            g.fillStyle = 'rgba(236,222,190,0.16)';
            g.beginPath(); g.arc(w[0] - rr * 0.2, w[1] - rr * 0.2, rr * 0.42, 0, TAU); g.fill();
          }
        }
      }
      /* 檐口一线亮，把顶勾出来 */
      var l1 = alProj(xe, yE + 0.055, za), l2 = alProj(xe, yE + 0.055, zb);
      if (l1 && l2) {
        g.strokeStyle = 'rgba(246,236,212,' + (0.16 + 0.12 * (1 - pp.lamp)) + ')';
        g.lineWidth = Math.max(0.9, 20 / (z0 - AL.z + 1.4) * 0.12);
        g.beginPath(); g.moveTo(l1[0], l1[1]); g.lineTo(l2[0], l2[1]); g.stroke();
      }
    }
  }
}

/* ---------- 过街楼 ---------- */
function alBridge(pp, t) {
  if (BRIDGE_Z < AL.z + 1.2) return;
  var dz = BRIDGE_Z - AL.z;
  var hz = cl(dz / 40, 0.02, 0.36);
  var y0 = 2.86, y1 = 3.92;

  /* 楼身：板壁 */
  var a = alProj(-AW, y0, BRIDGE_Z), b = alProj(AW, y0, BRIDGE_Z);
  var c = alProj(AW, y1, BRIDGE_Z), d = alProj(-AW, y1, BRIDGE_Z);
  if (alQuad(a, b, c, d)) {
    var bg = g.createLinearGradient(0, d[1], 0, a[1]);
    bg.addColorStop(0, shd('#5a4a33', BRIDGE_Z, 0.98));
    bg.addColorStop(1, shd('#3b3022', BRIDGE_Z, 0.72));
    g.fillStyle = bg;
    g.fill();
    /* 板缝 */
    g.strokeStyle = 'rgba(20,14,8,0.34)';
    g.lineWidth = 0.9;
    for (var k = -4; k <= 4; k++) {
      var xx = k * 0.24;
      var v1 = alProj(xx, y0, BRIDGE_Z), v2 = alProj(xx, y1, BRIDGE_Z);
      if (v1 && v2) { g.beginPath(); g.moveTo(v1[0], v1[1]); g.lineTo(v2[0], v2[1]); g.stroke(); }
    }
  }
  /* 楼板下沿 + 底下两根梁 */
  var e1 = alProj(-AW, y0 - 0.09, BRIDGE_Z), e2 = alProj(AW, y0 - 0.09, BRIDGE_Z);
  if (e1 && e2) {
    g.strokeStyle = shd('#241c13', BRIDGE_Z, 1.0);
    g.lineWidth = Math.max(1.6, 190 / dz * 0.10);
    g.beginPath(); g.moveTo(e1[0], e1[1]); g.lineTo(e2[0], e2[1]); g.stroke();
    g.lineWidth = Math.max(1, 190 / dz * 0.05);
    for (var bk = 0; bk < 3; bk++) {
      var bx = -0.66 + bk * 0.66;
      var b1 = alProj(bx, y0, BRIDGE_Z), b2 = alProj(bx, y0 - 0.20, BRIDGE_Z);
      if (b1 && b2) { g.beginPath(); g.moveTo(b1[0], b1[1]); g.lineTo(b2[0], b2[1]); g.stroke(); }
    }
  }

  /* 屋顶：前坡压得很扁，只在檐口露出一条瓦 */
  var f1 = alProj(-AW - 0.30, y1, BRIDGE_Z), f2 = alProj(AW + 0.30, y1, BRIDGE_Z);
  var f3 = alProj(AW + 0.14, y1 + 0.52, BRIDGE_Z), f4 = alProj(-AW - 0.14, y1 + 0.52, BRIDGE_Z);
  if (alQuad(f1, f2, f3, f4)) {
    var rg = g.createLinearGradient(0, f3[1], 0, f1[1]);
    rg.addColorStop(0, shd('#514a3a', BRIDGE_Z, 1.06));
    rg.addColorStop(1, shd('#332d24', BRIDGE_Z, 0.94));
    g.fillStyle = rg;
    g.fill();
    /* 瓦垄 */
    g.strokeStyle = 'rgba(24,20,14,0.30)';
    g.lineWidth = 0.8;
    for (var w2 = -7; w2 <= 7; w2++) {
      var xx2 = w2 * 0.22;
      var t1 = alProj(xx2, y1, BRIDGE_Z), t2 = alProj(xx2 * 0.86, y1 + 0.52, BRIDGE_Z);
      if (t1 && t2) { g.beginPath(); g.moveTo(t1[0], t1[1]); g.lineTo(t2[0], t2[1]); g.stroke(); }
    }
  }
  /* 檐口厚边 */
  if (f1 && f2) {
    g.fillStyle = shd('#26211a', BRIDGE_Z, 0.92);
    g.fillRect(Math.min(f1[0], f2[0]), f2[1] - 1, Math.abs(f2[0] - f1[0]), Math.max(2, 200 / dz * 0.045));
    g.fillStyle = 'rgba(240,230,204,0.10)';
    g.fillRect(Math.min(f1[0], f2[0]), f2[1] - 2.4, Math.abs(f2[0] - f1[0]), 1.2);
  }

  /* 楼上那扇亮窗 */
  var wx0 = -0.20, wx1 = 0.42;
  var w0 = alProj(wx0, y0 + 0.28, BRIDGE_Z), w1 = alProj(wx1, y0 + 0.28, BRIDGE_Z);
  var w2 = alProj(wx1, y0 + 0.76, BRIDGE_Z), w3 = alProj(wx0, y0 + 0.76, BRIDGE_Z);
  if (alQuad(w0, w1, w2, w3)) {
    var op = 0.30 + pp.lamp * 0.55;
    g.fillStyle = 'rgba(255,206,140,' + op + ')';
    g.fill();
    g.strokeStyle = shd('#2b2216', BRIDGE_Z, 0.9);
    g.lineWidth = 1;
    for (var m = 1; m < 3; m++) {
      var v1 = alProj(lp(wx0, wx1, m / 3), y0 + 0.28, BRIDGE_Z);
      var v2 = alProj(lp(wx0, wx1, m / 3), y0 + 0.76, BRIDGE_Z);
      if (v1 && v2) { g.beginPath(); g.moveTo(v1[0], v1[1]); g.lineTo(v2[0], v2[1]); g.stroke(); }
    }
    /* 光晕 */
    var cp = alProj((wx0 + wx1) / 2, y0 + 0.52, BRIDGE_Z);
    if (cp) {
      var rr = Math.max(14, 420 / dz * 0.5);
      var gr = g.createRadialGradient(cp[0], cp[1], 0, cp[0], cp[1], rr);
      gr.addColorStop(0, 'rgba(255,208,146,' + (0.20 * (0.3 + pp.lamp)) + ')');
      gr.addColorStop(1, 'rgba(255,200,130,0)');
      g.fillStyle = gr;
      g.beginPath(); g.arc(cp[0], cp[1], rr, 0, TAU); g.fill();
    }
  }

  /* 两侧柱子 */
  for (var s = -1; s <= 1; s += 2) {
    alFace(s * (AW - 0.10), 0, y0, BRIDGE_Z - 0.10, BRIDGE_Z - 0.02, shd('#4a3b29', BRIDGE_Z, 0.78));
  }
}

/* ---------- 地：青石板 ---------- */
function alGround(pp, t, znear) {
  var far = ALEN;
  var a = alProj(-AW, 0, znear), b = alProj(AW, 0, znear), c = alProj(AW, 0, far), d = alProj(-AW, 0, far);
  if (alQuad(a, b, c, d)) {
    var gr = g.createLinearGradient(0, c ? c[1] : 0, 0, a ? a[1] : H);
    gr.addColorStop(0, shd('#7b6f59', far, 0.60));
    gr.addColorStop(0.6, shd('#6e6350', 6, 0.60));
    gr.addColorStop(1, shd('#5f5644', 1, 0.62));
    g.fillStyle = gr;
    g.fill();
  }

  /* 石板：一行一行，近疏远密 */
  var rows = 32;
  for (var i = rows - 1; i >= 0; i--) {
    var u0 = i / rows, u1 = (i + 1) / rows;
    var z0 = lp(znear, far, u0), z1 = lp(znear, far, u1);
    if (z1 - z0 < 0.015) continue;
    var off = h2(i, 3) * 0.4;
    var cnt = 4;
    for (var k = 0; k < cnt; k++) {
      var xa = -AW + ((k + off) / cnt) * AW * 2;
      var xb = -AW + ((k + 1 + off) / cnt) * AW * 2;
      if (xa < -AW) xa = -AW;
      if (xb > AW) xb = AW;
      if (xb - xa < 0.04) continue;
      var a1 = alProj(xa + 0.018, 0, z1), b1 = alProj(xb - 0.018, 0, z1);
      var c1 = alProj(xb - 0.018, 0, z0), d1 = alProj(xa + 0.018, 0, z0);
      if (!alQuad(a1, b1, c1, d1)) continue;
      var tone = h2(i * 5 + k, 17);
      var cx = (xa + xb) / 2;
      var lit = 0.50 + 0.34 * (1 - Math.abs(cx) / AW);
      var base = tone < 0.34 ? '#84795f' : (tone < 0.68 ? '#776d56' : '#8d8168');
      g.fillStyle = shd(base, z0, lit);
      g.fill();
    }
  }

  /* 天光落在中段地上 */
  var lpz = 6.4, lx = 0;
  var gp = alProj(0, 0, lpz);

/* ---------- 一棵树的剪影（只生成一次） ---------- */
var _treeCv = null;
function alTree() {
  if (_treeCv) return _treeCv;
  var N = 320;
  var c = document.createElement('canvas');
  c.width = N; c.height = N;
  var q = c.getContext('2d');
  var rng = 20261019;
  function R() { rng = (rng * 1103515245 + 12345) & 0x7fffffff; return (rng % 100000) / 100000; }

  function branch(x, y, ang, len, w, depth) {
    var nx = x + Math.cos(ang) * len;
    var ny = y + Math.sin(ang) * len;
    q.strokeStyle = 'rgba(52,40,26,0.92)';
    q.lineWidth = w;
    q.lineCap = 'round';
    q.beginPath();
    q.moveTo(x, y);
    q.quadraticCurveTo(x + Math.cos(ang - 0.2) * len * 0.55,
      y + Math.sin(ang - 0.2) * len * 0.55, nx, ny);
    q.stroke();
    if (depth <= 0) {
      /* 叶簇 */
      var n = 7 + Math.floor(R() * 6);
      for (var i = 0; i < n; i++) {
        var a2 = R() * TAU, r2 = R() * len * 0.85;
        var ex = nx + Math.cos(a2) * r2, ey = ny + Math.sin(a2) * r2 * 0.8;
        q.fillStyle = 'rgba(' + (64 + Math.floor(R() * 30)) + ',' +
          (84 + Math.floor(R() * 34)) + ',' + (46 + Math.floor(R() * 24)) + ',' +
          (0.42 + R() * 0.28) + ')';
        q.beginPath();
        q.ellipse(ex, ey, 4 + R() * 9, 3 + R() * 7, R() * TAU, 0, TAU);
        q.fill();
      }
      return;
    }
    var k = 2 + (R() < 0.35 ? 1 : 0);
    for (var j = 0; j < k; j++) {
      var na = ang + (R() - 0.5) * 1.25;
      branch(nx, ny, na, len * (0.60 + R() * 0.20), w * 0.62, depth - 1);
    }
  }
  /* 主干从底部往上 */
  branch(N * 0.50, N * 1.02, -Math.PI / 2 + 0.10, N * 0.30, 13, 4);
  _treeCv = c;
  return c;
}

  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
}

function alMotes(pp, t) {
  if (!MOTES.length) alInitMotes();
  var day = 1 - cl(pp.lamp * 1.4, 0, 1);
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (var i = 0; i < MOTES.length; i++) {
    var m = MOTES[i];
    var p = alProj(m.x + Math.sin(t * 0.4 + m.ph) * 0.10, m.y + Math.sin(t * m.sp + m.ph) * 0.20, m.z);
    if (!p) continue;
    var a = (0.05 + 0.055 * Math.sin(t * 1.3 + m.ph)) * (0.3 + day * 0.8);
    g.fillStyle = 'rgba(255,238,196,' + a + ')';
    g.beginPath(); g.arc(p[0], p[1], Math.max(0.5, 24 / p[2] * 1.1), 0, TAU); g.fill();
  }
  g.restore();
}
function alHaze(pp) {
  var gr = g.createRadialGradient(VX, VY, H * 0.08, VX, VY, H * 0.90);
  gr.addColorStop(0, 'rgba(255,240,210,' + (0.02 + pp.lamp * 0.02) + ')');

/* ---------- 说话 ---------- */
function alSayB(pp, t) {
  if (!AL.say) return;
  var age = (performance.now() - AL.say.at) / 1000;
  if (age > 7.5) { AL.say = null; return; }
  var a = age < 0.3 ? age / 0.3 : (age > 6.4 ? Math.max(0, (7.5 - age) / 1.1) : 1);
  var f = AL.say.f;
  var bx, by;
  if (f && f._v) { bx = f._sx; by = f._sy - f._h * 1.24 - 14; }
  else { bx = W * 0.5; by = H * 0.44; }
  bx = cl(bx, 120, W - 120);
  by = Math.max(88, by);

  g.save();
  g.globalAlpha = a;
  var fs = Math.max(13, Math.min(17, H * 0.021));
  g.font = fs + 'px "KaiTi","STKaiti",serif';
  var tw = g.measureText(AL.say.text).width;
  var pw = tw + 34, phh = fs + 24;
  var rx = bx - pw / 2, ry = by - phh;

  g.fillStyle = 'rgba(20,15,10,0.90)';
  g.strokeStyle = 'rgba(206,172,112,' + (0.30 + 0.35 * a) + ')';
  g.lineWidth = 1;
  var rr = 7;
  g.beginPath();
  g.moveTo(rx + rr, ry);
  g.lineTo(rx + pw - rr, ry); g.quadraticCurveTo(rx + pw, ry, rx + pw, ry + rr);
  g.lineTo(rx + pw, ry + phh - rr); g.quadraticCurveTo(rx + pw, ry + phh, rx + pw - rr, ry + phh);
  g.lineTo(bx + 6, ry + phh);
  g.lineTo(bx + 1, ry + phh + 7);
  g.lineTo(bx - 1, ry + phh);
  g.lineTo(rx + rr, ry + phh); g.quadraticCurveTo(rx, ry + phh, rx, ry + phh - rr);
  g.lineTo(rx, ry + rr); g.quadraticCurveTo(rx, ry, rx + rr, ry);
  g.closePath();
  g.fill(); g.stroke();

  g.fillStyle = 'rgba(242,228,202,0.96)';
  g.font = fs + 'px "KaiTi","STKaiti",serif';
  g.textAlign = 'center';
  g.fillText(AL.say.text, bx, ry + phh - 9);
  g.restore();
}

/* ---------- 结尾 ---------- */
function alEndCard(pp) {

  g.lineTo(px + rr, py + phh); g.quadraticCurveTo(px, py + phh, px, py + phh - rr);

function alHud(pp) {
  var a = AL.mix;
  if (a < 0.2) return;
  g.save();
  g.globalAlpha = cl((a - 0.2) / 0.6, 0, 1) * 0.56;
  g.textAlign = 'center';
  g.fillStyle = 'rgba(240,226,200,0.86)';
  g.font = Math.max(9.5, Math.min(11, H * 0.0134)) + 'px "KaiTi","STKaiti",serif';

  var deep = Math.max(0, Math.round(AL.z - 0.85));

  else if (AL.z > ZMAX - 0.5) hint = '门前 · 轻点那道光';

  g.fillText(hint, W / 2, H - Math.max(18, H * 0.031));

/* ============================================================
   整幅
   ============================================================ */
function alScene(pp, t, dt) {
  g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';

  VX = W * 0.5 + AL.yaw * W * 0.16;
  VY = H * 0.515 + AL.bob * H * 0.010;
  FOC = H * 0.76;
  CY = Math.cos(AL.yaw * 0.62);
  SY = Math.sin(AL.yaw * 0.62);

  var FM = toRGB(pp.fog); _fog[0] = FM[0]; _fog[1] = FM[1]; _fog[2] = FM[2];
  var MM = toRGB(pp.mult); _mult[0] = MM[0]; _mult[1] = MM[1]; _mult[2] = MM[2];

  var znear = AL.z + 0.42;

  /* 天 */
  var skyG = g.createLinearGradient(0, 0, 0, VY + H * 0.06);
  skyG.addColorStop(0, mixHex(pp.top, '#ffffff', 0.05));
  skyG.addColorStop(0.5, pp.top);
  skyG.addColorStop(1, mixHex(pp.top, pp.bot, 0.62));
  g.fillStyle = skyG;
  g.fillRect(0, 0, W, H);

  /* 巷底那一点光，先漫出来 */
  var fg = g.createRadialGradient(VX, VY * 0.96, 0, VX, VY * 0.96, H * 0.62);
  fg.addColorStop(0, 'rgba(255,236,196,' + (0.13 + pp.lamp * 0.08) + ')');
  fg.addColorStop(0.35, 'rgba(252,222,172,' + (0.05 + pp.lamp * 0.04) + ')');
  fg.addColorStop(1, 'rgba(250,214,160,0)');
  g.fillStyle = fg;
  g.fillRect(0, 0, W, H);

  /* 尽头 */
  alEndWall(pp, t);

  /* 地 */
  alGround(pp, t, znear);

  /* 两侧墙，由远及近 */
  var n = Math.ceil(ALEN / SEG);
  for (var i = n - 1; i >= 0; i--) {
    var z0 = i * SEG, z1 = Math.min(ALEN, z0 + SEG);
    var za = Math.max(z0, AL.z + 0.42);
    if (z1 - za < 0.012) continue;
    alWall(-1, i, za, z1, pp);
    alWall(1, i, za, z1, pp);
    if (i > 0) { alReturn(-1, i, za, pp); alReturn(1, i, za, pp); }
    if (BRIDGE_Z > za && BRIDGE_Z < z1) alBridge(pp, t);
  }

  alEaves(pp);

  alLaundry(pp, t);
  alProps(pp, t);
  alClutter(pp, t);
  alLamps(pp, t);

  /* 人 */
  var list = [];
  for (var j = 0; j < FOLK.length; j++) {
    var dz = FOLK[j].z - AL.z;
    if (dz < 0.5) { FOLK[j]._v = 0; continue; }
    FOLK[j]._dz = dz;
    list.push(FOLK[j]);
  }
  list.sort(function (x, y) { return y._dz - x._dz; });
  for (var k = 0; k < list.length; k++) alFolk(list[k], pp, t);

  alShaft(pp, t);
  alMotes(pp, t);
  alHaze(pp);
  alGrain();
  alSayB(pp, t);
}

/* ============================================================
   推进
   ============================================================ */
function alTick(dt, t, pp) {
  AL.mix += (AL.tMix - AL.mix) * Math.min(1, dt * 4.2);
  if (AL.tMix === 0 && AL.mix < 0.01) {
    AL.on = false; AL.mix = 0; AL.snap = null;
    if (tipEl) tipEl.classList.remove('hide');
  }
  if (!AL.on) return;

  var tz = AL.z;
  if (AL.press) {
    AL.holdAcc += dt;
    if (AL.holdAcc > 0.16) AL.z += AL.walkIn * 2.15 * dt;
  }
  AL.z = cl(AL.z, ZMIN - 0.2, ZMAX);
  AL.vz = (AL.z - tz) / Math.max(0.0001, dt);

  var moving = Math.abs(AL.vz) > 0.15;
  AL.bob += dt * (moving ? 2.4 : 0.5);

  AL.yaw += (AL.tyaw - AL.yaw) * Math.min(1, dt * 3.2);
  AL.tyaw *= (1 - Math.min(1, dt * 0.5));
  AL.gate += (AL.tGate - AL.gate) * Math.min(1, dt * 1.6);

  if (AL.tGate > 0.5 && !AL.seed && AL.gate > 0.35) {
    AL.seed = true;
    AL.endAt = performance.now();
    try { localStorage.setItem('sanjing.seed.shijing', '1'); } catch (e) { }
  }
  if (AL.press && AL.walkIn < -0.4 && AL.z <= ZMIN + 0.02) alExit();
}

function alPaint(pp, t, dt) {
  if (!AL.on && AL.mix <= 0.002) return;
  var m = cl(AL.mix, 0, 1);

  alScene(pp, t, dt);

  if (m < 0.995 && AL.snap) {
    var age = (performance.now() - AL.snapAt) / 1000;
    var k = 1 + cl(age / 0.85, 0, 1) * 1.5;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = cl(1 - age / 0.85, 0, 1);
    ctx.drawImage(AL.snap, W / 2 - W * k / 2, H / 2 - H * k / 2, W * k, H * k);
    ctx.globalAlpha = 1;
  }

  g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  alEndCard(pp);
  alHud(pp);
}

/* ============================================================
   输入
   ============================================================ */
function alCaptures() { return AL.on || AL.mix > 0.02; }

function alDown(e) {
  AL.press = true;
  AL.px = e.clientX; AL.py = e.clientY; AL.holdY = e.clientY;
  AL.pt = performance.now(); AL.moved = 0; AL.holdAcc = 0;
  AL.walkIn = 1;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { }
}
function alMove(e) {
  if (!AL.press) return;
  var dx = e.clientX - AL.px;
  AL.moved = Math.max(AL.moved, Math.abs(dx) + Math.abs(e.clientY - AL.py));
  AL.px = e.clientX;
  AL.tyaw = cl(AL.tyaw - dx * 0.0024, -0.62, 0.62);
  AL.walkIn = cl(1 + (AL.holdY - e.clientY) / 70, -1.2, 1.7);
}
function alUp(e) {
  var dur = performance.now() - AL.pt;
  var tap = AL.moved < 10 && dur < 430;
  AL.press = false; AL.walkIn = 0;
  if (!tap) return;

  var mx = e.clientX, my = e.clientY;
  if (AL.seed && AL.link) {
    var L = AL.link;
    if (mx > L.x && mx < L.x + L.w && my > L.y && my < L.y + L.h) {
      window.location.href = 'https://podcatcher962.github.io/xinfang/';
      return;
    }
  }
  var f = alFolkAt(mx, my);
  if (f) { alTalk(f); return; }

  if (AL.gateR > 24) {
    var dx2 = mx - AL.gateSX, dy2 = my - AL.gateSY;
    if (dx2 * dx2 + dy2 * dy2 < (AL.gateR * 1.18) * (AL.gateR * 1.18)) {
      if (AL.z > ZMAX - 3.2) {
        AL.tGate = 1; AL.say = null;
        if (!AL.seed) AL.endAt = performance.now();
      } else {
        AL.say = { f: null, text: '还远。往里走。', at: performance.now() };
      }
      return;
    }
  }
  if (AL.say) AL.say = null;
}
function alWheel(e) {
  AL.z = cl(AL.z + e.deltaY * 0.010, ZMIN, ZMAX);
  AL.walkIn = 0;
}
function alKey(e) {
  var k = e.key;
  if (k === 'Escape') { alExit(); return true; }
  if (k === 'ArrowDown' || k === 's' || k === 'S') {
    AL.z = cl(AL.z - 1.1, ZMIN, ZMAX);
    if (AL.z <= ZMIN + 0.01) alExit();
    return true;
  }
  if (k === 'ArrowUp' || k === 'w' || k === 'W') {
    AL.z = cl(AL.z + 1.1, ZMIN, ZMAX);
    return true;
  }
  if (k === 'Enter' && AL.z > ZMAX - 3.2) { AL.tGate = 1; return true; }
  return true;
}

window.__ALLEY = {
  captures: alCaptures,
  full: function () { return AL.mix > 0.985; },
  active: function () { return AL.on; },
  drawMouths: alMouths,
  tapMouth: function (mx, my) {
    if (!ALLEYS.length) alBuildAlleys();
    for (var i = 0; i < ALLEYS.length; i++) {
      var m = ALLEYS[i];
      if (!m._hit) continue;
      var h = m._hit;
      if (mx > h.x - 8 && mx < h.x + h.w + 8 && my > h.y && my < h.y + h.h) {
        alEnter(m); return true;
      }
    }
    return false;
  },
  spotName: function () {
    if (!AL.on) return spotOf();
    var deep = Math.max(0, Math.round(AL.z - 0.85));
    if (AL.seed) return '巷底 · 门开着';
    if (AL.z > ZMAX - 0.5) return '门前';
    return '巷中 · ' + deep + ' 步';
  },
  enter: function (i) { if (!ALLEYS.length) alBuildAlleys(); alEnter(ALLEYS[i || 0]); },
  exit: alExit,
  tick: alTick,
  paint: alPaint,
  pointerDown: alDown,
  pointerMove: alMove,
  pointerUp: alUp,
  wheel: alWheel,
  key: alKey,
  get state() {
    return {
      on: AL.on, mix: +AL.mix.toFixed(3), z: +AL.z.toFixed(2),
      yaw: +AL.yaw.toFixed(3), gate: +AL.gate.toFixed(2), seed: AL.seed,
      said: JSON.parse(JSON.stringify(AL.said)), alleys: ALLEYS.length
    };
  },
  get mouthRects() {
    return ALLEYS.map(function (m) { return m._hit; });
  },
  setZ: function (v) { AL.z = cl(v, ZMIN, ZMAX); },

      return { id: f.id, v: f._v || 0, x: f._sx, y: f._sy, h: f._h };
    });
  },
  talk: function (id) {
    for (var i = 0; i < FOLK.length; i++) if (FOLK[i].id === id) { alTalk(FOLK[i]); return true; }
    return false;
  },
  get say() { return AL.say ? AL.say.text : null; },
  get linkRect() { return AL.link; }
};











/* ============================ 主循环 ============================ */
var lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0.016;
  lastT = now;
  var t = now / 1000;
  tNow = t;

  FRAME_N++;
  _fpsN++;
  if (now - _fpsT > 700) { FPS = Math.round(_fpsN * 1000 / (now - _fpsT)); _fpsT = now; _fpsN = 0; }

  if (MODE === MODE_STAY) {
    if (!paused) clock = (clock + dt * TSPEED) % 1;
  } else {
    var r = cam / Math.max(1, WW - W);
    clock = clamp(0.002 + r * 0.838, 0, 0.999);
  }

  cam += (tCam - cam) * Math.min(1, dt * 9);
  if (cam < -0.4) cam = -0.4;
  if (cam > WW - W + 0.4) cam = WW - W + 0.4;

  var p = pal(clock);
  p_lampNow = p.lamp;
  var g = ctx;

  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;

  if (window.__ALLEY && window.__ALLEY.full()) {
    window.__ALLEY.tick(dt, t, p);
    window.__ALLEY.paint(p, t, dt);
    updateHud(p);
    return;
  }

  drawSky(p, t);
  if (!DBG_OFF.far) drawFar(p);
  if (!DBG_OFF.mid) { drawMid(p, t); drawWall(p, t); }
  if (!DBG_OFF.back) {
    for (var i = 0; i < SHOPS2.length; i++) drawBuilding(SHOPS2[i], true);
  }
  if (!DBG_OFF.ground) { drawGround(p, t); drawShadows(p); }
  if (!DBG_OFF.bridge) drawBridge(p, t);
  LITWIN.length = 0;
  if (!DBG_OFF.shops) {
    for (var j = 0; j < SHOPS.length; j++) drawBuilding(SHOPS[j], false);
  }
  if (!DBG_OFF.people) { drawProps(p, t); drawPeople(p, t, dt); }
  if (!DBG_OFF.fore) drawTrees(p, t);
  if (!DBG_OFF.light) { drawLight(p, t); drawLamps(p, t); drawWindowGlow(p); }
  if (!DBG_OFF.fore) drawFore(p, t);
  if (!DBG_OFF.shops) window.__ALLEY.drawMouths(p, t);
  if (!DBG_OFF.atmos) drawAtmos(p, t);
  drawTex();
  drawSay(p, t);

  window.__ALLEY.tick(dt, t, p);
  window.__ALLEY.paint(p, t, dt);

  updateHud(p);
}

/* ============================ 交互 ============================ */
var dragging = false, dragX = 0, dragCam = 0, lastMove = 0;

var downX = 0, downY = 0, downT = 0, movedPx = 0;
cv.addEventListener('pointerdown', function (e) {
  if (window.__ALLEY && window.__ALLEY.captures()) { window.__ALLEY.pointerDown(e); return; }
  dragging = true; dragX = e.clientX; dragCam = tCam;
  downX = e.clientX; downY = e.clientY; downT = performance.now(); movedPx = 0;
  cv.classList.add('drag'); lastMove = performance.now();
  try { cv.setPointerCapture(e.pointerId); } catch (err) { }
});
cv.addEventListener('pointermove', function (e) {
  if (window.__ALLEY && window.__ALLEY.captures()) { window.__ALLEY.pointerMove(e); return; }
  if (!dragging) return;
  movedPx = Math.max(movedPx, Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY));
  tCam = clamp(dragCam - (e.clientX - dragX) * 1.25, 0, Math.max(0, WW - W));
  lastMove = performance.now();
});
function endDrag(e) { dragging = false; cv.classList.remove('drag'); lastMove = performance.now(); }
cv.addEventListener('pointerup', function (e) {
  if (window.__ALLEY && window.__ALLEY.captures()) { window.__ALLEY.pointerUp(e); return; }
  var wasDrag = movedPx > 9 || (performance.now() - downT > 420);
  endDrag(e);
  if (wasDrag) return;
  /* 轻点：找最近的人 */
  var q = personAt(e.clientX, e.clientY);
  if (q) { sayTo(q); return; }
  if (window.__ALLEY && window.__ALLEY.tapMouth(e.clientX, e.clientY)) return;
  if (SAY) SAY = null;
});
cv.addEventListener('pointercancel', endDrag);

cv.addEventListener('wheel', function (e) {
  e.preventDefault();
  if (window.__ALLEY && window.__ALLEY.captures()) { window.__ALLEY.wheel(e); return; }
  tCam = clamp(tCam + e.deltaY * 1.5 + e.deltaX * 1.5, 0, Math.max(0, WW - W));
  lastMove = performance.now();
}, { passive: false });

window.addEventListener('keydown', function (e) {
  if (window.__ALLEY && window.__ALLEY.captures()) { if (window.__ALLEY.key(e)) return; }
  var k = e.key;
  if (k === ' ') {
    e.preventDefault();
    MODE = (MODE === MODE_WALK) ? MODE_STAY : MODE_WALK;
    if (MODE === MODE_WALK) paused = false;
  } else if (k === 'ArrowRight') {
    tCam = clamp(tCam + W * 0.22, 0, Math.max(0, WW - W));
  } else if (k === 'ArrowLeft') {
    tCam = clamp(tCam - W * 0.22, 0, Math.max(0, WW - W));
  } else if (k === 'r' || k === 'R') {
    tCam = 0;
  } else if (k === 't' || k === 'T') {
    MODE = MODE_STAY; paused = false;
    clock = (clock + 0.09) % 1;
  }
  lastMove = performance.now();
});

cv.addEventListener('dblclick', function () { tCam = 0; });
window.addEventListener('resize', resize);

/* ============================ 启动 ============================ */
resize();
genWorld();
makeTreeSprites();
requestAnimationFrame(frame);

setTimeout(function () { veilEl.classList.add('gone'); }, 420);
setTimeout(function () { hudEl.classList.add('on'); tipEl.classList.add('on'); }, 1500);

/* ============================ 测试接口 ============================ */
window.__SJ = {
  get alley() { return window.__ALLEY; },
  geom: function () { return { W: W, H: H, HS: +HS.toFixed(3), HY: +HY.toFixed(1), WW: WW, BRISE: +BRISE.toFixed(1) }; },
  get cam() { return cam; },
  setCam: function (v) { tCam = clamp(v, 0, Math.max(0, WW - W)); cam = tCam; },
  get clock() { return clock; },
  setClock: function (v) { clock = clamp(v, 0, 0.999); MODE = MODE_STAY; },
  get mode() { return MODE; },
  setMode: function (m) { MODE = m; },
  get count() {
    return { shops: SHOPS.length, back: SHOPS2.length, people: PEOPLE.length, lamps: LAMPS.length, props: PROPS.length, trees: TREES.length, fps: FPS, frame: FRAME_N };
  },
  get clockName() { var c = czOf(clock); return c.name + '/' + c.alias; },
  get spot() { return spotOf(); },
  px: function (x, y) {
    var d = ctx.getImageData(Math.round(x * DPR), Math.round(y * DPR), 1, 1).data;
    return [d[0], d[1], d[2]];
  },
  avg: function (x, y, w, h) {
    var d = ctx.getImageData(Math.round(x * DPR), Math.round(y * DPR), Math.round(w * DPR), Math.round(h * DPR)).data;
    var r = 0, gg = 0, b = 0, n = d.length / 4;
    for (var i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
    return [Math.round(r / n), Math.round(gg / n), Math.round(b / n)];
  },
  get fps() { return FPS; },
  off: DBG_OFF,
  get people() { return PEOPLE; },
  get say() { return SAY; },
  clearSay: function () { SAY = null; },
  personAt: personAt,
  seek: function (r) { tCam = cam = clamp(r * (WW - W), 0, WW - W); },
  get cam() { return cam; },
  sayTo: sayTo,
  version: '1.1',
};
})();
