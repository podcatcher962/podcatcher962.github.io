}
html[data-theme="light"]{
  --bg:#f2e6cd;--card:#faf0dc;--bdr:#b8914f;--accent:#8a6a35;
  --gold:#7a5c1e;--text:#3e2f1d;--dim:#7d6a4d;--inp:#f7ecd6;--inpText:#3e2f1d;
  --mutedBdr:#d8c39a;--foot:#a08a63;--grid:rgba(138,106,53,0.08);
  --chip:#f0e3c8;--shadow:0 0 24px rgba(138,106,53,0.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);font-family:'Courier New','Microsoft YaHei',monospace;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 14px 50px;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 31px,var(--grid) 31px,var(--grid) 32px),repeating-linear-gradient(90deg,transparent,transparent 31px,var(--grid) 31px,var(--grid) 32px);
  transition:background 0.3s,color 0.3s;
}
.wrap{max-width:1060px;width:100%}
/* Splash 开屏 */
#splash{position:fixed;inset:0;z-index:300;background:#f2e6cd url('generated-images/hub_poster.jpg') center/contain no-repeat;animation:splashFade 9s ease forwards;}
@keyframes splashFade{0%{opacity:0}8%{opacity:1}70%{opacity:1}100%{opacity:0;visibility:hidden}}
/* Topbar */
.topbar{display:flex;justify-content:flex-end;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.topbar a{color:var(--dim);font-size:13px;cursor:pointer;text-decoration:none;letter-spacing:1px;border-bottom:1px solid transparent;transition:all 0.2s;user-select:none}
.topbar a:hover{color:var(--gold);border-color:var(--accent)}
.topbar a.active{color:var(--gold);font-weight:bold}
/* Header */
.hdr{text-align:center;margin:14px 0 8px}
.hdr h1{font-size:30px;color:var(--gold);letter-spacing:6px;text-shadow:0 0 24px rgba(255,215,0,0.2)}
.hdr .sub{font-size:15px;color:var(--accent);letter-spacing:4px;margin-top:8px;font-weight:bold}
.hdr .slogan{font-size:12px;color:var(--dim);letter-spacing:2px;margin-top:10px}
/* Stats */
.stats{display:flex;justify-content:center;gap:18px;margin:20px 0 6px;flex-wrap:wrap}
.stat{text-align:center;background:var(--chip);border:1px solid var(--mutedBdr);padding:10px 22px;min-width:110px}
.stat .num{font-size:26px;color:var(--gold);font-weight:bold}
.stat .lbl{font-size:10px;color:var(--dim);letter-spacing:2px;margin-top:2px}
/* Section */
.sec{margin:30px 0 10px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-h .bar{flex:1;height:1px;background:var(--bdr)}
.sec-h h2{font-size:17px;color:var(--gold);letter-spacing:4px;white-space:nowrap}
.sec-h .cnt{font-size:11px;color:var(--dim)}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{
  background:var(--card);border:2px solid var(--bdr);padding:18px 18px 16px;position:relative;
  display:flex;flex-direction:column;gap:10px;transition:transform 0.15s,box-shadow 0.2s;
  box-shadow:var(--shadow);
}
.card:hover{transform:translateY(-3px)}
.card .head{display:flex;align-items:center;gap:12px}
.card .icon{font-size:30px;line-height:1;filter:drop-shadow(0 0 6px rgba(255,215,0,0.2))}
.card .names{flex:1;min-width:0}
.card .cn{font-size:18px;color:var(--text);font-weight:bold;letter-spacing:2px}
.card .en{font-size:11px;color:var(--dim);letter-spacing:1px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ver{font-size:10px;color:var(--gold);border:1px solid var(--gold);padding:2px 8px;letter-spacing:1px;white-space:nowrap;align-self:flex-start}
.card .use{font-size:12px;color:var(--text);line-height:1.7;opacity:0.9;min-height:40px}
.card .btns{display:flex;gap:8px;margin-top:auto}
.card .btns a{
  flex:1;text-align:center;padding:9px 6px;font-size:12px;text-decoration:none;letter-spacing:1px;
  border:1px solid var(--bdr);color:var(--gold);background:var(--inp);transition:all 0.15s;white-space:nowrap;
}
.card .btns a:hover{background:var(--bdr);color:var(--gold);border-color:var(--accent)}
.card .btns a.exe{color:var(--accent)}
.card .btns a.exe:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.card .meta{font-size:10px;color:var(--dim);letter-spacing:1px;border-top:1px dashed var(--mutedBdr);padding-top:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}

.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{color:var(--gold)}
.tagline{font-size:10px;color:var(--dim);margin-top:6px}
/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);z-index:200;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border:3px solid var(--bdr);max-width:640px;width:100%;max-height:82vh;overflow-y:auto;padding:28px 30px;position:relative}
.modal-box h2{color:var(--gold);font-size:17px;letter-spacing:3px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.modal-box h3{color:var(--accent);font-size:13px;letter-spacing:1px;margin:16px 0 6px}
.modal-box p,.modal-box li{font-size:12px;color:var(--text);line-height:1.9;margin:6px 0}
.modal-box ul{padding-left:18px}
.modal-box a{color:var(--accent);text-decoration:none}
.modal-box a:hover{color:var(--gold)}
.modal-close{position:absolute;top:14px;right:18px;color:var(--dim);font-size:22px;cursor:pointer;background:none;border:none;font-family:inherit}
.modal-close:hover{color:var(--gold)}
/* Toast */
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:var(--bdr);color:var(--gold);padding:10px 22px;border:2px solid var(--accent);font-size:13px;font-family:inherit;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;letter-spacing:1px}
.toast.show{opacity:1}
@media(max-width:640px){
  .hdr h1{font-size:24px;letter-spacing:3px}
  .grid{grid-template-columns:1fr}
}

const CATS = {
  culture:{cn:"传统文化", en:"Traditional Culture", icon:"🏮"},
  tool:{cn:"效率工具", en:"Productivity Tools", icon:"🧰"},
  podcast:{cn:"播客工具", en:"Podcast Tools", icon:"📻"},
  personal:{cn:"个人站点", en:"Personal", icon:"🏡"},
};

// ============ 语言 ============
let lang = 'zh';
const I18N = {
  zh:{total:"软件总数", web:"在线版", exe:"EXE 版", sub:"兰兰软件汇总集", slogan:"藏兰兰全部软件于兰斋 · 收藏此页，实时获取更新",
      tagline:"单文件 HTML · 无追踪 · 无广告 · 免费开源", webBtn:"🖥 在线版", exeBtn:"⬇ EXE", ver:"版本",
      sound:"音乐", about:"关于", disclaim:"免责声明", copy:"复制链接", share:"分享", copied:"链接已复制"},
  en:{total:"Total Apps", web:"Web Apps", exe:"EXE Apps", sub:"Lanlan's Software Collection", slogan:"All of Lanlan's apps in one page · Bookmark for live updates",
      tagline:"Single-file HTML · No tracking · No ads · Free & open-source", webBtn:"🖥 Open", exeBtn:"⬇ EXE", ver:"Ver",
      sound:"Music", about:"About", disclaim:"Disclaimer", copy:"Copy Link", share:"Share", copied:"Link copied"},
};
function t(k){return I18N[lang][k];}
function setL(l){
  lang = l;
  document.getElementById('btnZh').className = l==='zh'?'active':'';
  document.getElementById('btnEn').className = l==='en'?'active':'';
  document.getElementById('slogan').textContent = t('slogan');
  document.getElementById('sub').textContent = t('sub');
  document.getElementById('tagline').textContent = t('tagline');
  document.getElementById('tSound').textContent = t('sound');
  document.getElementById('tAbout').textContent = t('about');
  document.getElementById('tDisclaim').textContent = t('disclaim');
  document.getElementById('tCopy').textContent = t('copy');
  document.getElementById('tShare').textContent = t('share');
  document.querySelectorAll('[data-l]').forEach(el=>{ el.textContent = t(el.getAttribute('data-l')); });
  render();
}

// ============ 主题 ============
function applyTheme(th){
  document.documentElement.setAttribute('data-theme', th);
  document.getElementById('btnTheme').textContent = th==='light'?'🌙':'☀️';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  applyTheme(cur);
  try{localStorage.setItem('hubTheme', cur);}catch(e){}
}

// ============ 复制链接 / 分享 ============
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._tid);
  el._tid = setTimeout(()=>el.classList.remove('show'), 2000);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  toast(t('copied'));
}
function copyLink(){
  const url = location.href;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>toast(t('copied'))).catch(()=>fallbackCopy(url));
  } else { fallbackCopy(url); }
}
function sharePage(){
  if(navigator.share){
    navigator.share({ title: document.title, url: location.href }).catch(()=>{});
  } else {
    copyLink();
  }
}

// ============ 背景音乐 ============
let soundOn = true;
function toggleSound(){
  soundOn = !soundOn;
  const bgm = document.getElementById('bgm');
  if(soundOn){ bgm.play().catch(()=>{}); }
  else { bgm.pause(); }
  document.getElementById('btnSound').className = soundOn ? 'active' : '';
}
(function(){
  const bgm = document.getElementById('bgm');
  if(!bgm) return;
  bgm.volume = 0.25;
  bgm.play().catch(()=>{});
  document.getElementById('btnSound').className = 'active';
  document.addEventListener('pointerdown', function(){
    if(soundOn && bgm.paused) bgm.play().catch(()=>{});
  });
})();

// ============ 渲染 ============
function render(){
  const root = document.getElementById('root');
  let html = '';
  let webCount = 0, exeCount = 0;

  for(const catKey of Object.keys(CATS)){
    const items = APPS.filter(a=>a.cat===catKey);
    if(!items.length) continue;
    const cat = CATS[catKey];
    html += `<div class="sec"><div class="sec-h"><span class="bar"></span><h2>${cat.icon} ${lang==='zh'?cat.cn:cat.en}</h2><span class="cnt">${items.length}</span><span class="bar"></span></div><div class="grid">`;
    for(const a of items){
      const use = lang==='zh'?a.use_cn:a.use_en;
      let btns = '';
      if(a.web){ const wu = a.web.startsWith('http') ? a.web : `https://podcatcher962.github.io/${a.web}/`; btns += `<a href="${wu}" target="_blank" rel="noopener">${t('webBtn')}</a>`; webCount++; }
      if(a.exe){ btns += `<a class="exe" href="${a.exe.url}" target="_blank" rel="noopener">${t('exeBtn')} · ${a.exe.size}</a>`; exeCount++; }
      const meta = (a.exe ? `${a.exe.name} · ${a.exe.size}` : (a.web ? (a.web.includes('http') ? '🌐 在线站' : `${a.web}.html`) : '—'));
      html += `
      <div class="card">
        <div class="head">
          <span class="icon">${a.icon}</span>
          <span class="names"><span class="cn">${a.cn}</span><span class="en">${a.en}</span></span>
          <span class="ver">${a.ver}</span>
        </div>
        <div class="use">${use}</div>
        <div class="btns">${btns}</div>
        <div class="meta"><span>${t('ver')}: ${a.ver}</span><span>${meta}</span></div>
      </div>`;
    }
    html += `</div></div>`;
  }

  root.innerHTML = html;
  document.getElementById('statTotal').textContent = APPS.length;
  document.getElementById('statWeb').textContent = webCount;
  document.getElementById('statExe').textContent = exeCount;
}
