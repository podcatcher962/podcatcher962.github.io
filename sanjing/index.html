<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { min-height:100%; background:#07080b; }
  body { font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
         color:#a08c6a; -webkit-font-smoothing:antialiased;
         padding:clamp(38px,7vh,84px) 26px clamp(44px,6.5vh,76px); }
  .wrap { max-width:760px; margin:0 auto; }

  .mark { text-align:center; }
  .mark .t { font-size:clamp(26px,5.2vw,40px); letter-spacing:clamp(14px,3.4vw,26px);
             text-indent:clamp(14px,3.4vw,26px); color:#c8b088; }
  .mark .sub { margin-top:22px; font-size:12px; letter-spacing:5px; text-indent:5px; color:#7a6a52; }
  .mark .rule { width:64px; height:1px; margin:28px auto 0;
                background:linear-gradient(to right, rgba(168,132,64,0), rgba(168,132,64,0.55), rgba(168,132,64,0)); }

  .list { margin-top:clamp(28px,4.6vh,48px); }

  a.item { display:flex; align-items:center; gap:clamp(18px,3.4vw,34px);
           padding:clamp(22px,3.4vh,30px) clamp(6px,2vw,18px);
           text-decoration:none; color:inherit; position:relative;
           border-top:1px solid rgba(140,112,66,0.22);
           transition:background 0.55s ease, transform 0.55s cubic-bezier(.22,.8,.3,1); }
  a.item:last-child { border-bottom:1px solid rgba(140,112,66,0.22); }
  a.item:hover { background:rgba(150,118,62,0.045); transform:translateX(4px); }

  .sym { flex:0 0 auto; width:clamp(44px,8vw,62px); height:clamp(44px,8vw,62px);
         display:flex; align-items:center; justify-content:center; }
  .sym svg { width:100%; height:100%; overflow:visible; }
  .sym .st { stroke:rgba(172,140,84,0.72); fill:none; transition:stroke 0.55s ease, filter 0.55s ease; }
  a.item:hover .sym .st { stroke:#e0c894; filter:drop-shadow(0 0 5px rgba(224,200,148,0.5)); }
  .sym .sf { fill:rgba(172,140,84,0.42); transition:fill 0.55s ease; }
  a.item:hover .sym .sf { fill:rgba(240,210,150,0.85); }

  .txt { flex:1 1 auto; min-width:0; }
  .num { font-size:11px; letter-spacing:4px; color:#7c6b50; }
  .nm { margin-top:8px; font-size:clamp(18px,3.1vw,24px); letter-spacing:5px; color:#cbb894;
        transition:color 0.55s ease; }
  a.item:hover .nm { color:#eddcb4; }
  .ds { margin-top:11px; font-size:clamp(12px,1.9vw,13.5px); line-height:1.95; letter-spacing:1.6px;
        color:#8a7960; }
  .go { flex:0 0 auto; font-size:12px; letter-spacing:3px; color:#7c6b50;
        transition:color 0.55s ease, transform 0.55s ease; }
  a.item:hover .go { color:#e0c894; transform:translateX(3px); }

  .foot { margin-top:clamp(40px,6.5vh,68px); text-align:center;
          font-size:11.5px; line-height:2.4; letter-spacing:2px; color:#6a5c46; }
  .foot b { font-weight:normal; color:#8a7960; }

  @media (max-width:520px) {
    .go { display:none; }
    a.item { gap:16px; }
    .ds { letter-spacing:1px; }
  }
</style>

<div class="wrap">

  <div class="list">

        <div class="nm">兰舟 · 月洞窗外</div>

      </div>

      </div>

        <div class="num">二 ／ 向 内 的 动</div>
        <div class="nm">市井 · 一条街的一天</div>
        <div class="ds">拖到街这头是卯时的城门，拖到那头是子时的城墙根。<br>走完一条街，就是一天。</div>
      </div>
      <div class="go">进 去 →</div>
    </a>

    <a class="item" href="../xinfang/">
